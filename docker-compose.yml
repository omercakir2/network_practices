# Linux only (Ubuntu VM, bare metal, on-prem server).
# scanner uses host networking so ARP sees the real LAN.
# Requires: Docker Engine on Linux, and for LAN scans a bridged/physical NIC
# (e.g. UTM bridged mode). Not intended for Docker Desktop on macOS.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-network}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-network}
      POSTGRES_DB: ${POSTGRES_DB:-network}
    ports:
      # Published on the Linux host so host-networked scanner can use 127.0.0.1
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  scanner:
    build: .
    # Share the host network namespace: real interfaces + ARP on the LAN.
    # Service DNS name "db" is NOT available; use 127.0.0.1 (published port).
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://network:network@127.0.0.1:5432/network?sslmode=disable}
      SSH_USERS: ${SSH_USERS:-}
      SSH_PASSWORDS: ${SSH_PASSWORDS:-}
      SSH_PORT: ${SSH_PORT:-22}
    cap_add:
      - NET_RAW
      - NET_ADMIN
    restart: "no"

volumes:
  pgdata:
